<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Hunian - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        @keyframes gradientFlow {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .rainbow-text {
            background: linear-gradient(90deg, #ef4444, #f59e0b, #10b981, #3b82f6, #a855f7, #ef4444);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientFlow 5s linear infinite;
        }

        .section-card {
            background: white;
            border-radius: 20px;
            border: 1.5px solid #f3f4f6;
            box-shadow: 0 2px 16px rgba(0,0,0,0.05);
            padding: 32px;
        }
        .input-field {
            width: 100%;
            border: 1.5px solid #e5e7eb;
            border-radius: 12px;
            padding: 12px 16px;
            outline: none;
            font-size: .95rem;
            color: #111827;
            transition: border-color .2s, box-shadow .2s;
            background: #f9fafb;
        }
        .input-field:focus {
            border-color: #a855f7;
            box-shadow: 0 0 0 4px rgba(168,85,247,.1);
            background: white;
        }
    </style>
    <div th:replace="~{fragments/dropdown :: dropdown-css}"></div>
</head>
<body class="bg-gray-50 min-h-screen">
<!-- #nadia(Admin) -->

<header class="border-b border-gray-200 sticky top-0 bg-white z-50">
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div th:replace="~{fragments/dropdown :: dropdown-html}"></div>
            <a href="/admin/dashboard" class="flex items-center gap-2 text-xl font-bold">
                <i class="fas fa-user-shield rainbow-text"></i>
                <span class="rainbow-text">Superkos Admin</span>
            </a>
        </div>
    </div>
</header>

<div class="max-w-3xl mx-auto px-4 py-10">
    <div class="mb-6 flex items-center gap-4">
        <a href="/admin/dashboard" class="w-10 h-10 rounded-xl bg-gray-200 text-gray-600 flex items-center justify-center hover:bg-gray-300 transition">
            <i class="fas fa-arrow-left"></i>
        </a>
        <h1 class="text-2xl font-black text-gray-900">Edit Hunian</h1>
    </div>

    <div class="section-card">
        <form th:action="@{'/admin/hunian/' + ${hunian.idHunian} + '/update'}" method="post" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5">Nama Hunian</label>
                <input type="text" name="namaHunian" class="input-field" th:value="${hunian.namaHunian}" required>
            </div>
            <div class="grid grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">Harga (Rp)</label>
                    <input type="number" name="harga" class="input-field" th:value="${hunian.harga}" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">Kapasitas (Orang/Kamar)</label>
                    <input type="number" name="jumlahKamar" class="input-field" th:value="${hunian.jumlahKamar}" required>
                </div>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5">Lokasi</label>
                <input type="text" name="lokasi" class="input-field" th:value="${hunian.lokasi}" required>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5">Deskripsi</label>
                <textarea name="deskripsi" class="input-field" rows="4" th:text="${hunian.deskripsi}" required></textarea>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5">Tipe Gender</label>
                <select name="tipeGender" class="input-field" required>
                    <option value="Pria" th:selected="${hunian.tipeGender == 'Pria'}">Pria</option>
                    <option value="Wanita" th:selected="${hunian.tipeGender == 'Wanita'}">Wanita</option>
                    <option value="Campur" th:selected="${hunian.tipeGender == 'Campur'}">Campur</option>
                </select>
            </div>

            <div class="pt-4 mt-6 border-t border-gray-100 flex justify-end gap-3">
                <a href="/admin/dashboard" class="px-6 py-2.5 rounded-xl font-bold text-gray-600 bg-gray-100 hover:bg-gray-200 transition">Batal</a>
                <button type="submit" class="px-6 py-2.5 rounded-xl font-bold text-white bg-purple-600 hover:bg-purple-700 transition shadow-lg">Simpan Perubahan</button>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments/dropdown :: dropdown-js}"></div>
<!-- #/nadia(Admin) -->
</body>
</html>
